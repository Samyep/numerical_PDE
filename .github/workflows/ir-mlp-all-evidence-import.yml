name: Build approved IR-MLP all-evidence manuscript
on:
  push:
    branches: [publish/ir-mlp-all-evidence-20261005]
    paths: [_manuscript_transfer/ir_mlp_all_evidence/READY.json]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconstruct verified transfer
        run: |
          set -euo pipefail
          T=_manuscript_transfer/ir_mlp_all_evidence
          for x in "$T"/text_payload.part*.b64; do base64 -d "$x"; done > /tmp/ir_mlp_text_payload.tar.xz
          for x in "$T"/finance_budget_curve.png.part*.b64; do base64 -d "$x"; done > /tmp/finance_budget_curve.png
          for x in "$T"/hjb_violation_rate_panel.png.part*.b64; do base64 -d "$x"; done > /tmp/hjb_violation_rate_panel.png
          echo "9d504f342df7105cf1f993fa5248b5598b541a2c3a46c4a389bb120e816b605c  /tmp/ir_mlp_text_payload.tar.xz" | sha256sum -c -
          echo "11aa02be6407e24fda565ef86f8c582bc1f90828fccde0eb5e3d79f3ce505f76  /tmp/finance_budget_curve.png" | sha256sum -c -
          echo "e66ea02b21372417b0309630603b8fb676ac026fd98f9ecb2ff280b1e0ee4b02  /tmp/hjb_violation_rate_panel.png" | sha256sum -c -
          rm -rf invariant_region_mlp/paper/icml2026
          mkdir -p invariant_region_mlp/paper/icml2026/figures
          tar -xJf /tmp/ir_mlp_text_payload.tar.xz -C invariant_region_mlp/paper/icml2026
          cp /tmp/finance_budget_curve.png invariant_region_mlp/paper/icml2026/figures/
          cp /tmp/hjb_violation_rate_panel.png invariant_region_mlp/paper/icml2026/figures/
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils libcairo2
          python -m pip install --disable-pip-version-check numpy matplotlib cairosvg
      - name: Regenerate all reproducible figure panels
        working-directory: invariant_region_mlp/paper/icml2026
        run: |
          set -euo pipefail
          python scripts/restore_figures.py
          python scripts/plot_extended_suite.py
          python scripts/plot_restored_evidence.py
          # Keep the two archived raster panels and vector PDFs; discard redundant generated PNG copies/SVG renderings.
          find figures -type f -name '*.png' ! -name 'finance_budget_curve.png' ! -name 'hjb_violation_rate_panel.png' -delete
          find figures -type f -name '*.svg' -delete
      - name: Compile ICML manuscript
        working-directory: invariant_region_mlp/paper/icml2026
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > build-pass-1.txt
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > build-pass-2.txt
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > build-pass-3.txt
          if grep -E 'There were undefined references|Reference .* undefined|Citation .* undefined' main.log; then exit 1; fi
          pdfinfo main.pdf | grep -E '^(Pages|Page size)'
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          info=subprocess.check_output(['pdfinfo','main.pdf'],text=True)
          pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          refs=[]
          for p in [Path('main.tex'), *sorted(Path('sections').glob('*.tex'))]:
              refs += re.findall(r'\\includegraphics(?:\[[^\]]*\])?\{([^}]+)\}',p.read_text())
          missing=[r for r in refs if not Path(r).exists()]
          assert not missing, missing
          Path('GIT_PUBLISH_REPORT.json').write_text(json.dumps({
              'source':'Constraint_Aware_MLP_ICML2026_all_evidence.zip',
              'compiled_pages':pages,
              'figure_placements':len(refs),
              'distinct_figure_files':len(set(refs)),
              'compile_passes':3,
              'undefined_references':False,
              'transfer_checksums_verified':True,
              'note':'Large raw overshoot NPZ and duplicate raster renderings are omitted; all manuscript-used panels are present.'
          },indent=2)+'\n')
          PY
          rm -f main.aux main.log main.out main.toc build-pass-1.txt build-pass-2.txt build-pass-3.txt
      - name: Commit clean manuscript tree to staging branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A invariant_region_mlp/paper/icml2026
          git rm -rf _manuscript_transfer/ir_mlp_all_evidence
          git rm .github/workflows/ir-mlp-all-evidence-import.yml
          git commit -m 'Publish complete-evidence ICML manuscript with all figure panels'
          git push origin HEAD:publish/ir-mlp-all-evidence-20261005
